version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: daily
      time: "04:10"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - automerge
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: daily
      time: "04:40"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - automerge
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-images:
        patterns:
          - "*"
