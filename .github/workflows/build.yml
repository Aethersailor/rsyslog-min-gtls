name: build-rsyslog-gtls

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read tracked rsyslog version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d ' \r\n\t' < UPSTREAM_VERSION)"
          if [[ ! "$ref" =~ ^v8\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid UPSTREAM_VERSION: $ref" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: rsyslog-min-gtls:ci
          build-args: |
            RSYSLOG_REF=${{ steps.version.outputs.ref }}
          cache-from: type=gha,scope=validation

      - name: Smoke test validation image
        shell: bash
        run: bash ./scripts/smoke-test.sh rsyslog-min-gtls:ci

  publish:
    name: Publish image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect latest upstream tag
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$({
            git ls-remote --tags --refs https://github.com/rsyslog/rsyslog.git 'v8.*' \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | sort -V \
              | tail -n 1
          })"
          if [[ ! "$latest_tag" =~ ^v8\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unable to resolve a valid upstream rsyslog tag: $latest_tag" >&2
            exit 1
          fi
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: decide
        shell: bash
        env:
          LATEST_TAG: ${{ steps.upstream.outputs.latest_tag }}
        run: |
          set -euo pipefail
          needs_build=true
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            current="$(tr -d ' \r\n\t' < UPSTREAM_VERSION 2>/dev/null || true)"
            if [[ "$LATEST_TAG" == "$current" ]]; then
              needs_build=false
            fi
          fi
          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.decide.outputs.needs_build == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: steps.decide.outputs.needs_build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.decide.outputs.needs_build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        if: steps.decide.outputs.needs_build == 'true'
        shell: bash
        env:
          RSYSLOG_REF: ${{ steps.upstream.outputs.latest_tag }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/rsyslog-min-gtls"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${image}:latest" >> "$GITHUB_OUTPUT"
          echo "${image}:${RSYSLOG_REF}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        if: steps.decide.outputs.needs_build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.tags }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rsyslog-min-gtls:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rsyslog-min-gtls:${{ steps.upstream.outputs.latest_tag }}
          build-args: |
            RSYSLOG_REF=${{ steps.upstream.outputs.latest_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish

      - name: Verify published image digests
        if: steps.decide.outputs.needs_build == 'true'
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          GHCR_IMAGE: ${{ steps.tags.outputs.image }}
          DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rsyslog-min-gtls
          RSYSLOG_REF: ${{ steps.upstream.outputs.latest_tag }}
        run: |
          set -euo pipefail
          refs=(
            "${GHCR_IMAGE}:latest"
            "${GHCR_IMAGE}:${RSYSLOG_REF}"
            "${DOCKERHUB_IMAGE}:latest"
            "${DOCKERHUB_IMAGE}:${RSYSLOG_REF}"
          )
          for ref in "${refs[@]}"; do
            digest="$(
              docker buildx imagetools inspect "$ref" \
                | awk '$1 == "Digest:" { print $2; exit }'
            )"
            if [[ -z "$digest" || "$digest" != "$EXPECTED_DIGEST" ]]; then
              echo "Unexpected digest for ${ref}: ${digest:-missing}" >&2
              exit 1
            fi
            media_type="$(
              docker buildx imagetools inspect --raw "$ref" \
                | jq -r '.mediaType // empty'
            )"
            if [[ "$media_type" != "application/vnd.oci.image.manifest.v1+json" \
              && "$media_type" != "application/vnd.docker.distribution.manifest.v2+json" ]]; then
              echo "${ref} is not a direct image manifest: ${media_type:-missing}" >&2
              exit 1
            fi
          done

      - name: Smoke test published images
        if: steps.decide.outputs.needs_build == 'true'
        shell: bash
        env:
          GHCR_IMAGE: ${{ steps.tags.outputs.image }}:${{ steps.upstream.outputs.latest_tag }}
          DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rsyslog-min-gtls:${{ steps.upstream.outputs.latest_tag }}
        run: |
          set -euo pipefail
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            docker pull "$image"
            bash ./scripts/smoke-test.sh "$image"
          done

      - name: Clean and verify container registries
        if: steps.decide.outputs.needs_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          bash ./scripts/clean-container-registries.sh \
            '${{ steps.tags.outputs.image }}' \
            '${{ secrets.DOCKERHUB_USERNAME }}' \
            'rsyslog-min-gtls'

      - name: Record upstream version
        if: steps.decide.outputs.needs_build == 'true'
        shell: bash
        env:
          RSYSLOG_REF: ${{ steps.upstream.outputs.latest_tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RSYSLOG_REF" > UPSTREAM_VERSION
          if git diff --quiet -- UPSTREAM_VERSION; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM_VERSION
          git commit -m "chore(upstream): bump rsyslog to $RSYSLOG_REF"
          git push origin HEAD:main

      - name: Skip unchanged upstream
        if: steps.decide.outputs.needs_build != 'true'
        shell: bash
        run: echo "Upstream unchanged; skipping image publication."
